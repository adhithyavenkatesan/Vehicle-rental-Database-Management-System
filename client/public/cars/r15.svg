<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <linearGradient id="yamahaBlue" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="darkFairing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="alloyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="bikeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.7" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)" />
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
  </g>

  <g transform="translate(48, 48)">
    <rect x="0" y="0" width="220" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="14" y="21" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" letter-spacing="1.5">YAMAHA R15 V4</text>
    <circle cx="198" cy="16" r="4" fill="#3b82f6" />
  </g>
  <text x="752" y="52" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" text-anchor="end">SUPERSPORT 155CC</text>

  <ellipse cx="400" cy="385" rx="280" ry="22" fill="#000" opacity="0.6" filter="blur(8px)" />

  <g filter="url(#bikeShadow)">
    <!-- Rear Wheel with Blue Alloys -->
    <g transform="translate(230, 310)">
      <circle cx="0" cy="0" r="72" fill="#0f172a" stroke="#1e293b" stroke-width="12" />
      <circle cx="0" cy="0" r="54" fill="none" stroke="url(#alloyGrad)" stroke-width="5" />
      <line x1="-50" y1="0" x2="50" y2="0" stroke="url(#alloyGrad)" stroke-width="5" />
      <line x1="0" y1="-50" x2="0" y2="50" stroke="url(#alloyGrad)" stroke-width="5" />
      <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#334155" stroke-width="2" />
    </g>

    <!-- Front Wheel with Blue Alloys -->
    <g transform="translate(570, 310)">
      <circle cx="0" cy="0" r="72" fill="#0f172a" stroke="#1e293b" stroke-width="12" />
      <circle cx="0" cy="0" r="54" fill="none" stroke="url(#alloyGrad)" stroke-width="5" />
      <line x1="-50" y1="0" x2="50" y2="0" stroke="url(#alloyGrad)" stroke-width="5" />
      <line x1="0" y1="-50" x2="0" y2="50" stroke="url(#alloyGrad)" stroke-width="5" />
      <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#334155" stroke-width="2" />
      <circle cx="0" cy="0" r="38" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8,4" />
    </g>

    <!-- Upside-down Gold Front Forks -->
    <line x1="510" y1="180" x2="570" y2="310" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />

    <!-- Deltabox Frame -->
    <path d="M230 310 L350 280 L440 250 L500 190" fill="none" stroke="#475569" stroke-width="14" stroke-linecap="round" />

    <!-- Compact Upswept Sport Silencer -->
    <path d="M370 295 L450 310 L280 285" fill="none" stroke="#1e293b" stroke-width="16" stroke-linecap="round" />
    <polygon points="270,280 320,295 315,310 265,295" fill="#334155" />

    <!-- Aerodynamic Racing Fairing & Tank -->
    <!-- Fuel Tank -->
    <path d="M360 210 C380 170, 440 165, 480 185 C495 195, 485 230, 420 235 Z" fill="url(#yamahaBlue)" stroke="#1d4ed8" stroke-width="2" />
    <!-- Front Fairing Nose -->
    <path d="M480 185 L550 180 L590 195 L560 230 L500 240 Z" fill="url(#yamahaBlue)" stroke="#1e3a8a" stroke-width="2" />
    <!-- Windscreen Visor -->
    <path d="M515 160 C535 155, 560 165, 575 185 L530 185 Z" fill="#0284c7" opacity="0.65" />
    <!-- Dual LED Headlight Eye -->
    <polygon points="565,195 585,198 565,203" fill="#38bdf8" />

    <!-- Mid Belly-Pan Fairing -->
    <path d="M430 235 L500 240 L480 310 L370 305 Z" fill="url(#darkFairing)" stroke="#334155" stroke-width="1" />
    <!-- White Racing Decal Graphic -->
    <path d="M450 245 L490 260 L485 275 L445 260 Z" fill="#ffffff" opacity="0.8" />

    <!-- Stepped High Tail Section -->
    <path d="M240 220 L350 225 L370 240 L260 255 Z" fill="url(#yamahaBlue)" stroke="#1d4ed8" stroke-width="2" />
    <!-- Split Racing Seat -->
    <path d="M320 215 C340 210, 370 215, 380 230 C350 235, 320 230, 320 215 Z" fill="#020617" />
    <path d="M260 210 C280 205, 305 210, 310 220 C290 225, 260 225, 260 210 Z" fill="#020617" />
    <!-- LED Tail Light -->
    <polygon points="235,223 245,220 245,226" fill="#ef4444" />
  </g>
</svg>
