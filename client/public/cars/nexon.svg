<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nexonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="nexonBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="roofNexon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="glassNexon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.8" />
    </linearGradient>
    <filter id="nexonShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#nexonBg)" />
  
  <!-- Ambient EV Circuit Grid -->
  <g opacity="0.08" stroke="#2dd4bf" stroke-width="1.5" fill="none">
    <path d="M 0 380 H 300 L 340 420 H 800" />
    <circle cx="340" cy="420" r="4" fill="#2dd4bf" />
  </g>

  <!-- Ground Electric Glow -->
  <ellipse cx="400" cy="370" rx="350" ry="24" fill="#14b8a6" opacity="0.22" />
  <ellipse cx="400" cy="365" rx="310" ry="12" fill="#000" opacity="0.65" />

  <!-- Car Graphics: Tata Nexon.ev (Modern Aerodynamic Electric Crossover) -->
  <g filter="url(#nexonShadow)">
    <!-- Main SUV Body -->
    <path d="M 120 315
             L 135 285
             Q 155 245 220 240
             L 300 235
             L 380 165
             Q 420 155 560 158
             L 620 165
             Q 665 175 680 230
             L 705 280
             L 700 315
             L 650 315
             Q 640 295 605 295
             Q 570 295 560 315
             L 310 315
             Q 300 295 265 295
             Q 230 295 220 315
             L 135 315
             Z"
          fill="url(#nexonBody)" stroke="#2dd4bf" stroke-width="2" />

    <!-- Dual-Tone White Floating Coupe Roof -->
    <path d="M 378 168
             L 400 156
             Q 450 148 570 152
             L 630 160
             Q 655 168 668 200
             L 655 200
             Q 640 165 570 160
             L 400 160
             Z"
          fill="url(#roofNexon)" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Sleek Window Line -->
    <path d="M 395 168 L 480 168 L 480 230 L 320 230 Z" fill="url(#glassNexon)" stroke="#0f172a" stroke-width="2" />
    <path d="M 488 168 L 585 168 Q 625 170 645 210 L 645 230 L 488 230 Z" fill="url(#glassNexon)" stroke="#0f172a" stroke-width="2" />

    <!-- Signature Connected Horizon Front LED Lightbar (Nexon.ev Identity) -->
    <line x1="125" y1="265" x2="225" y2="255" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" />
    <circle cx="130" cy="265" r="4" fill="#ffffff" />
    
    <!-- Connected X-Factor Rear Taillamp -->
    <path d="M 685 245 L 705 260 L 695 285 Z" fill="#ef4444" stroke="#991b1b" stroke-width="2" />

    <!-- EV Aero Cladding & Cyan Accent Strip -->
    <path d="M 230 315 L 560 315" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" />

    <!-- Futuristic Aero Disc EV Wheels -->
    <!-- Front Wheel -->
    <g transform="translate(265, 310)">
      <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="#2dd4bf" stroke-width="3" />
      <circle cx="0" cy="0" r="36" fill="#1e293b" stroke="#64748b" stroke-width="2" />
      <!-- Aero Blade Inserts -->
      <path d="M 0 -30 L 15 -10 L 0 0 Z" fill="#2dd4bf" opacity="0.9" />
      <path d="M 25 15 L 5 15 L 0 0 Z" fill="#2dd4bf" opacity="0.9" />
      <path d="M -25 15 L -10 0 L 0 0 Z" fill="#2dd4bf" opacity="0.9" />
      <circle cx="0" cy="0" r="10" fill="#042f2e" stroke="#5eead4" stroke-width="2" />
    </g>

    <!-- Rear Wheel -->
    <g transform="translate(605, 310)">
      <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="#2dd4bf" stroke-width="3" />
      <circle cx="0" cy="0" r="36" fill="#1e293b" stroke="#64748b" stroke-width="2" />
      <!-- Aero Blade Inserts -->
      <path d="M 0 -30 L 15 -10 L 0 0 Z" fill="#2dd4bf" opacity="0.9" />
      <path d="M 25 15 L 5 15 L 0 0 Z" fill="#2dd4bf" opacity="0.9" />
      <path d="M -25 15 L -10 0 L 0 0 Z" fill="#2dd4bf" opacity="0.9" />
      <circle cx="0" cy="0" r="10" fill="#042f2e" stroke="#5eead4" stroke-width="2" />
    </g>
  </g>

  <!-- Typography Badging -->
  <g transform="translate(48, 55)">
    <rect x="0" y="0" width="135" height="24" rx="12" fill="#14b8a6" fill-opacity="0.2" stroke="#14b8a6" stroke-width="1" />
    <text x="67" y="16" fill="#2dd4bf" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">ZERO EMISSION • EV</text>
    
    <text x="0" y="58" fill="#ffffff" font-size="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" letter-spacing="0.5">Tata Nexon.ev</text>
    <text x="0" y="84" fill="#94a3b8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">Empowered+ LR • 465 km Certified Range • Fast Charging</text>
  </g>

  <!-- Indian Registration Plate Badge (Green EV Plate) -->
  <g transform="translate(620, 50)">
    <rect x="0" y="0" width="132" height="34" rx="5" fill="#15803d" stroke="#16a34a" stroke-width="1.5" />
    <rect x="0" y="0" width="22" height="34" rx="4" fill="#0284c7" />
    <text x="11" y="21" fill="#ffffff" font-size="9" font-family="monospace" font-weight="800" text-anchor="middle">IND</text>
    <text x="77" y="23" fill="#ffffff" font-size="13" font-family="monospace" font-weight="800" text-anchor="middle" letter-spacing="1">DL 01 EV 3301</text>
  </g>
</svg>
