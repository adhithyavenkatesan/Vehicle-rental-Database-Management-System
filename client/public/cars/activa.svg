<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <linearGradient id="scooterBlue" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="innerFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="chromeTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="scooterShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)" />
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
  </g>

  <g transform="translate(48, 48)">
    <rect x="0" y="0" width="220" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="14" y="21" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" letter-spacing="1.5">HONDA ACTIVA 6G</text>
    <circle cx="198" cy="16" r="4" fill="#38bdf8" />
  </g>
  <text x="752" y="52" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" text-anchor="end">CITY COMMUTER SCOOTER</text>

  <ellipse cx="400" cy="385" rx="270" ry="20" fill="#000" opacity="0.6" filter="blur(8px)" />

  <g filter="url(#scooterShadow)">
    <!-- Rear Wheel -->
    <g transform="translate(240, 325)">
      <circle cx="0" cy="0" r="58" fill="#0f172a" stroke="#1e293b" stroke-width="10" />
      <circle cx="0" cy="0" r="42" fill="#334155" stroke="#475569" stroke-width="3" />
      <circle cx="0" cy="0" r="16" fill="#64748b" />
    </g>

    <!-- Front Wheel -->
    <g transform="translate(560, 325)">
      <circle cx="0" cy="0" r="60" fill="#0f172a" stroke="#1e293b" stroke-width="10" />
      <circle cx="0" cy="0" r="44" fill="#334155" stroke="#475569" stroke-width="3" />
      <circle cx="0" cy="0" r="16" fill="#64748b" />
    </g>

    <!-- Exhaust & Engine Enclosure -->
    <rect x="220" y="300" width="120" height="30" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M260 315 L320 315" stroke="url(#chromeTrim)" stroke-width="6" stroke-linecap="round" />

    <!-- Scooter Body - Rear Cowl & Engine Bay -->
    <path d="M200 280 C200 230, 240 215, 360 215 L390 290 L240 310 Z" fill="url(#scooterBlue)" stroke="#0284c7" stroke-width="2" />
    <!-- Activa 3D Chrome Emblem line -->
    <path d="M230 250 Q280 240 330 252" fill="none" stroke="url(#chromeTrim)" stroke-width="4" stroke-linecap="round" />

    <!-- Comfortable Long Two-Seater Saddle -->
    <path d="M230 215 C260 205, 350 205, 410 225 L395 240 L235 235 Z" fill="#020617" stroke="#334155" stroke-width="2" />
    <!-- Rear Pillion Grab Rail (Alloy) -->
    <path d="M195 235 L230 220 L235 228" fill="none" stroke="url(#chromeTrim)" stroke-width="6" stroke-linecap="round" />

    <!-- Flat Footboard Deck -->
    <path d="M370 295 L470 295 L490 260 L380 260 Z" fill="url(#innerFloor)" stroke="#475569" stroke-width="1.5" />
    <!-- Rubber grip strips on footboard -->
    <line x1="395" y1="280" x2="455" y2="280" stroke="#0f172a" stroke-width="3" />
    <line x1="400" y1="288" x2="460" y2="288" stroke="#0f172a" stroke-width="3" />

    <!-- Front Apron & Shield -->
    <path d="M465 295 L490 260 L515 190 L570 205 L555 315 L500 315 Z" fill="url(#scooterBlue)" stroke="#0369a1" stroke-width="2" />
    <!-- Chrome Wing Accent on Front Apron -->
    <path d="M515 220 Q540 228 550 220" fill="none" stroke="url(#chromeTrim)" stroke-width="4" stroke-linecap="round" />
    <!-- Front Turn Indicator -->
    <polygon points="535,230 550,233 545,245" fill="#f59e0b" />

    <!-- Front Telescopic Suspension -->
    <line x1="535" y1="250" x2="560" y2="325" stroke="#475569" stroke-width="8" stroke-linecap="round" />

    <!-- Handlebar & Headlamp Cowling -->
    <path d="M495 160 L545 160 L540 185 L505 185 Z" fill="url(#scooterBlue)" stroke="#0284c7" stroke-width="2" />
    <!-- Bright LED Headlight -->
    <polygon points="530,165 542,168 538,180" fill="#fef08a" stroke="#fff" stroke-width="1" />
    <!-- Black Grips & Rear View Mirrors -->
    <line x1="480" y1="165" x2="495" y2="165" stroke="#020617" stroke-width="6" stroke-linecap="round" />
    <circle cx="485" cy="135" r="9" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <line x1="488" y1="144" x2="498" y2="160" stroke="#64748b" stroke-width="3" />
  </g>
</svg>
