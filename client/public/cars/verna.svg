<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="vernaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="vernaBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="vernaGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.8" />
    </linearGradient>
    <filter id="vernaShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#vernaBg)" />
  
  <ellipse cx="400" cy="370" rx="360" ry="24" fill="#dc2626" opacity="0.18" />
  <ellipse cx="400" cy="365" rx="320" ry="12" fill="#000" opacity="0.7" />

  <!-- Car Graphics: Hyundai Verna (Fastback Turbo Sedan Silhouette) -->
  <g filter="url(#vernaShadow)">
    <path d="M 115 315
             L 125 285
             L 175 255
             L 305 245
             L 400 170
             Q 455 160 575 162
             L 640 168
             Q 675 185 695 245
             L 720 255
             L 715 315
             L 665 315
             Q 655 295 620 295
             Q 585 295 575 315
             L 305 315
             Q 295 295 260 295
             Q 225 295 215 315
             L 125 315
             Z"
          fill="url(#vernaBody)" stroke="#f87171" stroke-width="2" />

    <!-- Horizon LED Seamless Front Lightbar -->
    <line x1="120" y1="285" x2="200" y2="278" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    
    <!-- Parametric Fastback Glasshouse -->
    <path d="M 410 174 L 500 174 L 500 235 L 330 235 Z" fill="url(#vernaGlass)" stroke="#0f172a" stroke-width="2" />
    <path d="M 508 174 L 605 174 Q 640 176 660 220 L 665 235 L 508 235 Z" fill="url(#vernaGlass)" stroke="#0f172a" stroke-width="2" />

    <!-- H-Connecting LED Taillamp -->
    <path d="M 700 255 L 720 258 L 715 275 Z" fill="#ffffff" stroke="#ef4444" stroke-width="2" />

    <!-- Wheels (16" Gloss Black Alloys with Red Brake Calipers) -->
    <g transform="translate(260, 310)">
      <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="#475569" stroke-width="4" />
      <circle cx="0" cy="0" r="34" fill="#171717" stroke="#dc2626" stroke-width="2" />
      <circle cx="0" cy="0" r="18" fill="#dc2626" opacity="0.8" /> <!-- Red Caliper -->
      <line x1="0" y1="-28" x2="0" y2="28" stroke="#f8fafc" stroke-width="3" />
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#f8fafc" stroke-width="3" />
      <circle cx="0" cy="0" r="9" fill="#0f172a" stroke="#f8fafc" stroke-width="2" />
    </g>

    <g transform="translate(620, 310)">
      <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="#475569" stroke-width="4" />
      <circle cx="0" cy="0" r="34" fill="#171717" stroke="#dc2626" stroke-width="2" />
      <circle cx="0" cy="0" r="18" fill="#dc2626" opacity="0.8" />
      <line x1="0" y1="-28" x2="0" y2="28" stroke="#f8fafc" stroke-width="3" />
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#f8fafc" stroke-width="3" />
      <circle cx="0" cy="0" r="9" fill="#0f172a" stroke="#f8fafc" stroke-width="2" />
    </g>
  </g>

  <!-- Typography Badging -->
  <g transform="translate(48, 55)">
    <rect x="0" y="0" width="135" height="24" rx="12" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="1" />
    <text x="67" y="16" fill="#f87171" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">TURBO FASTBACK</text>
    
    <text x="0" y="58" fill="#ffffff" font-size="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" letter-spacing="0.5">Hyundai Verna</text>
    <text x="0" y="84" fill="#94a3b8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">SX(O) 1.5 Turbo GDi • 160 PS • 7-Speed Dual Clutch (DCT)</text>
  </g>

  <!-- Indian Registration Plate Badge -->
  <g transform="translate(620, 50)">
    <rect x="0" y="0" width="132" height="34" rx="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
    <rect x="0" y="0" width="22" height="34" rx="4" fill="#0284c7" />
    <text x="11" y="21" fill="#ffffff" font-size="9" font-family="monospace" font-weight="800" text-anchor="middle">IND</text>
    <text x="77" y="23" fill="#0f172a" font-size="13" font-family="monospace" font-weight="800" text-anchor="middle" letter-spacing="1">KA 05 KL 3141</text>
  </g>
</svg>
