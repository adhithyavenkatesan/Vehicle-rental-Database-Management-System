<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="innovaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191924" />
      <stop offset="100%" stop-color="#0c0c14" />
    </linearGradient>
    <linearGradient id="innovaBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="glassGradInnova" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="innovaShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#innovaBg)" />
  
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="360" x2="800" y2="360" />
  </g>

  <!-- Ground Glow -->
  <ellipse cx="400" cy="370" rx="360" ry="24" fill="#3b82f6" opacity="0.12" />
  <ellipse cx="400" cy="365" rx="330" ry="12" fill="#000" opacity="0.6" />

  <!-- Car Graphics: Toyota Innova Crysta (Long Wheelbase 7-Seater MPV) -->
  <g filter="url(#innovaShadow)">
    <!-- Main MPV Body Shell -->
    <path d="M 110 315
             L 125 285
             L 170 250
             L 260 235
             L 340 160
             L 670 160
             Q 705 165 715 210
             L 720 310
             L 665 315
             Q 655 295 620 295
             Q 585 295 575 315
             L 295 315
             Q 285 295 250 295
             Q 215 295 205 315
             L 125 315
             Z"
          fill="url(#innovaBody)" stroke="#64748b" stroke-width="2" />

    <!-- 3-Row Panoramic Window Line (A, B, C, D Pillars) -->
    <!-- Front Row Window -->
    <path d="M 345 168 L 440 168 L 440 228 L 270 228 Z" fill="url(#glassGradInnova)" stroke="#1e293b" stroke-width="2" />
    <!-- Middle Row Window -->
    <path d="M 448 168 L 565 168 L 565 228 L 448 228 Z" fill="url(#glassGradInnova)" stroke="#1e293b" stroke-width="2" />
    <!-- 3rd Row Quarter Glass -->
    <path d="M 573 168 L 665 168 Q 685 170 690 205 L 690 228 L 573 228 Z" fill="url(#glassGradInnova)" stroke="#1e293b" stroke-width="2" />

    <!-- Chrome Beltline Accent -->
    <line x1="265" y1="230" x2="695" y2="230" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

    <!-- Crystal Headlamps with LED DRLs -->
    <path d="M 120 290 Q 155 270 175 275 L 165 295 Z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" />
    <!-- Wrap-around Taillamps -->
    <path d="M 700 240 L 718 245 L 715 275 L 695 270 Z" fill="#ef4444" stroke="#991b1b" stroke-width="2" />

    <!-- Chrome Door Handles -->
    <rect x="375" y="240" width="24" height="6" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <rect x="500" y="240" width="24" height="6" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />

    <!-- Wheels (Executive Diamond-Cut Alloys) -->
    <!-- Front Wheel -->
    <g transform="translate(250, 310)">
      <circle cx="0" cy="0" r="50" fill="#1e293b" stroke="#475569" stroke-width="4" />
      <circle cx="0" cy="0" r="34" fill="#64748b" stroke="#cbd5e1" stroke-width="2" />
      <line x1="0" y1="-28" x2="0" y2="28" stroke="#f8fafc" stroke-width="4" />
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#f8fafc" stroke-width="4" />
      <line x1="-20" y1="-20" x2="20" y2="20" stroke="#f8fafc" stroke-width="4" />
      <line x1="-20" y1="20" x2="20" y2="-20" stroke="#f8fafc" stroke-width="4" />
      <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    </g>

    <!-- Rear Wheel -->
    <g transform="translate(620, 310)">
      <circle cx="0" cy="0" r="50" fill="#1e293b" stroke="#475569" stroke-width="4" />
      <circle cx="0" cy="0" r="34" fill="#64748b" stroke="#cbd5e1" stroke-width="2" />
      <line x1="0" y1="-28" x2="0" y2="28" stroke="#f8fafc" stroke-width="4" />
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#f8fafc" stroke-width="4" />
      <line x1="-20" y1="-20" x2="20" y2="20" stroke="#f8fafc" stroke-width="4" />
      <line x1="-20" y1="20" x2="20" y2="-20" stroke="#f8fafc" stroke-width="4" />
      <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    </g>
  </g>

  <!-- Typography Badging -->
  <g transform="translate(48, 55)">
    <rect x="0" y="0" width="135" height="24" rx="12" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1" />
    <text x="67" y="16" fill="#60a5fa" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">PREMIUM MPV (7-STR)</text>
    
    <text x="0" y="58" fill="#ffffff" font-size="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" letter-spacing="0.5">Toyota Innova Crysta</text>
    <text x="0" y="84" fill="#94a3b8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">ZX 2.4D Luxury • 7 Captain Seats • Rear AC • Automatic</text>
  </g>

  <!-- Indian Registration Plate Badge -->
  <g transform="translate(620, 50)">
    <rect x="0" y="0" width="132" height="34" rx="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
    <rect x="0" y="0" width="22" height="34" rx="4" fill="#0284c7" />
    <text x="11" y="21" fill="#ffffff" font-size="9" font-family="monospace" font-weight="800" text-anchor="middle">IND</text>
    <text x="77" y="23" fill="#0f172a" font-size="13" font-family="monospace" font-weight="800" text-anchor="middle" letter-spacing="1">KA 03 MN 4422</text>
  </g>
</svg>
